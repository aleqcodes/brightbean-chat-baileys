<section id="baileys-qr" class="mt-4 flex flex-col items-center rounded-xl border p-4 text-center" hx-get="{{ qr_url }}" hx-trigger="every 4s" hx-swap="outerHTML">
  {% if qr %}
    <img src="{{ qr }}" alt="Código QR para vincular dispositivo do WhatsApp" class="h-64 w-64 max-w-full rounded border p-2" referrerpolicy="no-referrer">
    <p class="section-note mt-3">Este código QR é atualizado automaticamente. Escaneie-o antes de expirar.</p>
    {% if expires_at %}<time class="section-note mt-1" datetime="{{ expires_at }}">Expira em {{ expires_at }}</time>{% endif %}
  {% else %}
    <p class="section-note" role="status">Não há código QR ativo. Inicie o pareamento ou aguarde o gateway.</p>
  {% endif %}
</section>

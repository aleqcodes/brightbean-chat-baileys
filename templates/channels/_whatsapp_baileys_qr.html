<section id="baileys-qr" class="space-y-3" hx-get="{{ qr_url }}" hx-trigger="every 4s" hx-swap="outerHTML">
  {% if qr %}
    <img src="{{ qr }}" alt="WhatsApp linked-device pairing QR code" class="max-w-xs rounded border p-2" referrerpolicy="no-referrer">
    {% if expires_at %}<p>QR refreshes automatically. Expiry: {{ expires_at }}</p>{% endif %}
  {% else %}
    <p role="status">No current QR code. Start pairing or wait for the gateway.</p>
  {% endif %}
</section>
